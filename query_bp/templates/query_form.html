<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
</head>
<body>
<div class="center">
    <h2>{{ title }}</h2>

    <form method="post">
        {% for field in fields %}
        <p>
            <label for="{{ field.name }}">{{ field.label }}</label><br>

            <input id="{{ field.name }}"
                   name="{{ field.name }}"
                   type="text"
                   inputmode="{{ field.inputmode }}"
                   placeholder="{{ field.placeholder }}"
                   required>
        </p>
        {% endfor %}

        <input type="submit" value="Найти">
    </form>

    <p>
        <a href="{{ url_for('query.request_handler') }}">
            Назад к запросам
        </a>
    </p>
</div>
</body></html>
